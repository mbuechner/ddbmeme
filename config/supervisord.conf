[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:memegen]
command=/bin/sh -c 'exec /home/memegen/.venv/bin/gunicorn --bind 127.0.0.1:5001 --worker-tmp-dir /tmp --worker-class uvicorn.workers.UvicornWorker --workers "${WEB_CONCURRENCY:-${MEMEGEN_WORKERS:-1}}" --max-requests "${MAX_REQUESTS:-${MEMEGEN_MAX_REQUESTS:-200}}" --max-requests-jitter "${MAX_REQUESTS_JITTER:-${MEMEGEN_MAX_REQUESTS_JITTER:-30}}" --timeout "${TIMEOUT:-${MEMEGEN_GUNICORN_TIMEOUT:-180}}" app.main:app'
directory=/home/memegen
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
priority=100

[program:ddbmeme]
command=/bin/sh /etc/supervisor/ddbmeme-start.sh
directory=/home/ddbmeme
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
priority=200

[eventlistener:processes]
command=/opt/ddbmeme-venv/bin/python /etc/supervisor/exit-on-fatal.py
events=PROCESS_STATE_FATAL
priority=10
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
