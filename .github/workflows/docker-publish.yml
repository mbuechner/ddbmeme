name: Docker

on:
  release:
    types: [published]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable GitHub release tag. Leave empty for the maintained release.
        type: string
      http_path:
        description: Override the HTTP path for this run.
        type: string
      http_port:
        description: Override the container port for this run.
        type: string
      container_user:
        description: Override the smoke-test user for this run (UID:GID).
        type: string

permissions: {}

jobs:
  dispatch-release:
    name: Queue the publisher on the default branch
    if: github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh workflow run docker-publish.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" --raw-field "release_tag=$RELEASE_TAG"

  publish:
    name: Check and publish the release image
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    concurrency:
      group: docker-publish
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TARGET_PLATFORM: linux/amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out workflow tools from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select a published stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ inputs.release_tag }}
          MAINTAINED_RELEASE: ${{ vars.CONTAINER_RELEASE_TAG }}
        run: |
          tag_pattern='^v[0-9][0-9A-Za-z_.-]{0,126}$'
          requested="${REQUESTED_RELEASE:-$MAINTAINED_RELEASE}"
          endpoint="repos/$GITHUB_REPOSITORY/releases/latest"
          if [[ -n "$requested" ]]; then
            if [[ ! "$requested" =~ $tag_pattern ]]; then
              echo '::error::Specify a version tag such as v1.4.7.'
              exit 1
            fi
            endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$requested"
          fi
          tag="$(gh api "$endpoint" --jq 'select(.published_at and (.draft | not) and (.prerelease | not)) | .tag_name')"
          if [[ ! "$tag" =~ $tag_pattern ]]; then
            echo '::error::Select a published stable release with a v-prefixed version tag.'
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the release source and Dockerfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: release-source
          persist-credentials: false

      - name: Read the release revision and timestamps
        id: source
        run: |
          revision="$(git -C release-source rev-parse HEAD)"
          epoch="$(git -C release-source show -s --format=%ct HEAD)"
          created="$(date -u -d "@$epoch" +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "revision=$revision"
            echo "epoch=$epoch"
            echo "created=$created"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compare release and base image digests
        id: bases
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
        run: python3 .github/scripts/container-build-inputs.py release-source/Dockerfile

      - name: Build and stage the candidate by digest
        id: build
        if: steps.bases.outputs.reusable_digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
        with:
          context: release-source
          build-contexts: ${{ steps.bases.outputs.contexts }}
          platforms: ${{ env.TARGET_PLATFORM }}
          pull: true
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.created=${{ steps.source.outputs.created }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.base.name=${{ steps.bases.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ steps.bases.outputs.base_digest }}
            de.ddb.labs.ddbmeme.build-inputs=${{ steps.bases.outputs.fingerprint }}
          outputs: type=image,name=${{ steps.source.outputs.image }},push=true,push-by-digest=true,name-canonical=true,rewrite-timestamp=true
          cache-from: type=gha,scope=ddbmeme
          cache-to: type=gha,scope=ddbmeme,mode=max

      - name: Check HTTP startup and scan the digest
        uses: ./.github/actions/check-container
        with:
          image: ${{ steps.source.outputs.image }}@${{ steps.build.outputs.digest || steps.bases.outputs.reusable_digest }}
          platform: ${{ env.TARGET_PLATFORM }}
          container-port: ${{ inputs.http_port || vars.CONTAINER_HTTP_PORT || '8080' }}
          http-path: ${{ inputs.http_path || vars.CONTAINER_HTTP_PATH || '/healthz' }}
          http-attempts: ${{ vars.CONTAINER_HTTP_ATTEMPTS || '30' }}
          container-user: ${{ inputs.container_user || vars.CONTAINER_USER || '10001:0' }}
          container-env: |
            SECRET_KEY=ddbmeme-ci-health-check
            ALLOWED_HOSTS=127.0.0.1,localhost
            USE_X_FORWARDED_HOST=0
            MEMEGEN_PREWARM_ENABLED=0
          cyclonedx-path: ${{ vars.CONTAINER_SBOM_PATH || '/home/ddbmeme/sbom.cdx.json' }}
          block-on-fixable: 'true'

      - name: Determine which tags need the checked digest
        id: promotion
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest || steps.bases.outputs.reusable_digest }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
          MAINTAINED_RELEASE: ${{ vars.CONTAINER_RELEASE_TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          published_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq 'select(.published_at and (.draft | not) and (.prerelease | not)) | .tag_name')"
          if [[ "$published_tag" != "$RELEASE_TAG" ]]; then
            echo '::error::The selected release is no longer published as stable.'
            exit 1
          fi

          current_revision="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$RELEASE_TAG" --jq '.sha')"
          if [[ "$current_revision" != "$RELEASE_REVISION" ]]; then
            echo '::error::The Git tag changed during the run. Run the publisher again.'
            exit 1
          fi

          # Resolve latest after the checks, since a newer release may now be available.
          maintained="$MAINTAINED_RELEASE"
          if [[ -z "$maintained" ]]; then
            maintained="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          fi
          tags=("$IMAGE:$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == "$maintained" ]]; then
            tags+=("$IMAGE:latest" "$IMAGE:tagged")
          fi

          promotion=()
          for tag in "${tags[@]}"; do
            if ! current="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$tag" 2>&1)"; then
              if [[ "${current,,}" == *"${tag,,}: not found"* || "${current,,}" == *'manifest unknown'* ]]; then
                current=''
              else
                printf '%s\n' "$current" >&2
                exit 1
              fi
            fi
            if [[ "$current" != "$DIGEST" ]]; then
              promotion+=("$tag")
            fi
          done
          if (( ${#promotion[@]} == 0 )); then
            printf 'Checked existing digest `%s@%s`.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            printf 'image=%s@%s\n' "$IMAGE" "$DIGEST"
            printf '%s\n' 'tags<<TAGS' "${promotion[@]}" TAGS
          } >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: steps.promotion.outputs.tags != ''
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign and publish the checked digest
        if: steps.promotion.outputs.tags != ''
        env:
          IMAGE: ${{ steps.promotion.outputs.image }}
          PROMOTION_TAGS: ${{ steps.promotion.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done <<< "$PROMOTION_TAGS"
          cosign sign --yes "$IMAGE"
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE"
          printf 'Published checked digest `%s`.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
