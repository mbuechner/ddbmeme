{% extends 'base.html' %}

{% block javascript %}
<script>
    const ARCHIVE_KEY = 'ddbmeme_archive_v2';
    const $query = $('#id_query');
    const $top = $('#id_toptext');
    const $bottom = $('#id_bottomtext');
    const $source = $('#id_image');
    const $alert = $('#alert_message');
    const $slides = $('#carouselIndicators .carousel-inner');
    const $indicators = $('#carouselIndicators .carousel-indicators');
    const welcome = $alert.contents().clone();
    const meme = bootstrap.Collapse.getOrCreateInstance(document.getElementById('meme'), { toggle: false });
    let lookupTimer;
    let lookupRequest;
    let generation;

    function httpUrl(value) {
        if (typeof value !== 'string' || !value) {
            return '';
        }
        try {
            const url = new URL(value, window.location.href);
            return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
        } catch {
            return '';
        }
    }

    function showWelcome() {
        $alert.empty().append(welcome.clone());
    }

    function showMessage(message, showExample = false) {
        $alert.text(message);
        if (showExample) {
            const example = $query.attr('placeholder');
            $('<a>').attr({ id: 'alert_example', href: example }).addClass('alert-link')
                .text(example).on('click', function (event) {
                    event.preventDefault();
                    $query.val(example).trigger('input');
                }).appendTo($alert.append(' '));
        }
    }

    function activeImage() {
        return $slides.find('.carousel-item.active img');
    }

    function updateLinks() {
        const $image = activeImage();
        const source = $image.attr('data-source') || '';
        const share = $image.attr('data-share') || source;
        const download = $image.attr('data-download') || share;
        $source.val(source);
        $('#linkToMeme').val(share);
        $('#saveBtn').attr('href', download || null);
        $('#facebookBtn').attr('href', share ? 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(share) : null);
        $('#twitterBtn').attr('href', share ? 'https://x.com/share?url=' + encodeURIComponent(share) : null);
    }

    function archiveThumb(entry) {
        if (typeof entry.image !== 'string') {
            return '';
        }
        return /^data:image\/jpeg;base64,/i.test(entry.image) ? entry.image : httpUrl(entry.image);
    }

    function loadArchive() {
        try {
            const items = JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]');
            return Array.isArray(items) ? items.filter(function (entry) {
                return entry && httpUrl(entry.url);
            }) : [];
        } catch {
            return [];
        }
    }

    let archive = loadArchive();

    function writeArchive() {
        try {
            localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive));
        } catch {
            showMessage('The browser could not save the latest change to your archive.');
        }
    }

    function caption(entry) {
        return [entry.toptext, entry.bottomtext].filter(function (text) {
            return typeof text === 'string' && text.length;
        }).join(' / ') || 'Meme';
    }

    function appendArchiveItem(entry) {
        const $card = $('<div>').addClass('card archive-card position-relative').data('entry', entry);
        const $open = $('<button>').attr({ type: 'button', 'aria-label': 'Restore meme: ' + caption(entry) })
            .addClass('w-100 border-0 bg-transparent p-0');
        $('<img>').attr({ src: archiveThumb(entry) || httpUrl(entry.url), alt: '', loading: 'lazy' })
            .addClass('card-img-top archive-thumb').appendTo($open);
        const $remove = $('<button>').attr({ type: 'button', title: 'Delete', 'aria-label': 'Delete thumbnail' })
            .addClass('btn btn-sm btn-outline-secondary archive-delete position-absolute top-0 end-0 m-1')
            .css({ width: '1.6rem', height: '1.6rem', padding: 0 }).text('×');
        $('#archiveGrid').prepend($('<div>').addClass('col').append($card.append($open, $remove)));
    }

    function saveToArchive(entry, image) {
        const scale = Math.min(1, 400 / Math.max(image.naturalWidth, image.naturalHeight));
        try {
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
            canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
            entry.image = canvas.toDataURL('image/jpeg', 0.8);
        } catch {
            // Keep the full-size meme link when a thumbnail cannot be created.
        }
        archive.push(entry);
        writeArchive();
        appendArchiveItem(entry);
    }

    function showSlides(images, selected = 0) {
        $slides.empty();
        $indicators.empty();
        images.forEach(function (item, index) {
            const active = index === selected;
            const $image = $('<img>').addClass('d-block w-100 rounded-0').attr({
                src: item.preview || item.image,
                alt: item.alt || 'DDB image',
                'data-source': item.image,
                'data-uuid': item.uuid || '',
                'data-share': item.share || '',
                'data-download': item.download || ''
            });
            $('<div>').addClass('carousel-item').toggleClass('active', active).append($image).appendTo($slides);
            $('<button>').attr({
                type: 'button', 'data-bs-target': '#carouselIndicators', 'data-bs-slide-to': index,
                'aria-label': 'Slide ' + (index + 1), 'aria-current': active ? 'true' : null
            }).toggleClass('active', active).appendTo($indicators);
        });
        $('#carouselIndicators .carousel-control-prev, #carouselIndicators .carousel-control-next')
            .add($indicators).toggle(images.length > 1);
        updateLinks();
        if (images.length) {
            meme.show();
        } else {
            meme.hide();
        }
    }

    function cancelLookup() {
        clearTimeout(lookupTimer);
        const request = lookupRequest;
        lookupRequest = null;
        if (request) {
            request.abort();
        }
    }

    function startLookup(restored = null) {
        const query = $query.val().trim();
        if (!query) {
            return;
        }
        const request = $.ajax({
            url: $('#search').attr('data-validate-query-url'),
            data: { query: query },
            dataType: 'json',
            timeout: 12000,
            success: function (data) {
                if (lookupRequest !== request) {
                    return;
                }
                showMessage(data.message, data.show_example);
                if (!data.images) {
                    return;
                }
                const images = JSON.parse(data.images);
                if (!restored) {
                    showSlides(images);
                    return;
                }
                const selected = images.findIndex(function (item) {
                    return item.image === restored.image || (restored.uuid && item.uuid === restored.uuid);
                });
                if (selected >= 0) {
                    images[selected] = { ...images[selected], ...restored, image: images[selected].image };
                    showSlides(images, selected);
                }
            },
            error: function () {
                if (lookupRequest === request) {
                    showMessage('The images could not be loaded. Please try again.');
                }
            },
            complete: function () {
                if (lookupRequest === request) {
                    lookupRequest = null;
                }
            }
        });
        lookupRequest = request;
    }

    function finishGeneration(run) {
        if (generation !== run) {
            return false;
        }
        generation = null;
        clearTimeout(run.slowTimer);
        clearTimeout(run.deadline);
        if (run.request && run.request.readyState !== 4) {
            run.request.abort();
        }
        if (run.image) {
            run.image.onload = null;
            run.image.onerror = null;
        }
        $('#generate').prop('disabled', false).removeAttr('aria-busy');
        $('#memeSpinner').addClass('d-none');
        return true;
    }

    function cancelGeneration() {
        const run = generation;
        if (run && finishGeneration(run) && run.image) {
            run.image.removeAttribute('src');
        }
    }

    function failGeneration(run, message) {
        if (generation === run) {
            cancelGeneration();
            showMessage(message);
        }
    }

    $('#make').on('submit', function (event) {
        event.preventDefault();
        const $image = activeImage();
        const entry = {
            toptext: $top.val(), bottomtext: $bottom.val(), query: $query.val(),
            source: $source.val(), uuid: $image.attr('data-uuid')
        };
        if (generation || !$image.length || (!entry.toptext.trim() && !entry.bottomtext.trim())) {
            return;
        }

        cancelLookup();
        const run = {};
        generation = run;
        $('#generate').prop('disabled', true).attr('aria-busy', 'true');
        $('#memeSpinner').removeClass('d-none');
        run.slowTimer = setTimeout(function () {
            run.slow = true;
            showMessage('Meme generation is taking longer than usual. Please wait.');
        }, 15000);
        run.deadline = setTimeout(function () {
            failGeneration(run, 'The image service did not answer in time. Please try again.');
        }, 190000);
        run.request = $.ajax({
            url: $(this).attr('data-validate-query-url'),
            data: { toptext: entry.toptext, bottomtext: entry.bottomtext, image: entry.source },
            dataType: 'json',
            timeout: 10000,
            success: function (data) {
                if (generation !== run) {
                    return;
                }
                entry.url = httpUrl(data.url);
                entry.download = httpUrl(data.download);
                if (!entry.url) {
                    failGeneration(run, 'The image service did not provide a meme link.');
                    return;
                }
                run.image = new Image();
                run.image.onload = function () {
                    if (!finishGeneration(run)) {
                        return;
                    }
                    $(run.image).addClass('d-block w-100 rounded-0').attr({
                        alt: caption(entry), 'data-source': entry.source, 'data-uuid': entry.uuid,
                        'data-share': entry.url, 'data-download': entry.download
                    });
                    $image.replaceWith(run.image);
                    updateLinks();
                    if (run.slow) {
                        showWelcome();
                    }
                    saveToArchive(entry, run.image);
                };
                run.image.onerror = function () {
                    failGeneration(run, 'The image service could not generate the meme. Please try again.');
                };
                run.image.src = entry.url;
            },
            error: function (xhr) {
                failGeneration(run, xhr.responseJSON?.message || 'Meme generation failed. Please try again.');
            }
        });
    });

    function search(delay) {
        cancelLookup();
        cancelGeneration();
        showSlides([]);
        showWelcome();
        if ($query.val().trim()) {
            lookupTimer = setTimeout(startLookup, delay);
        }
    }

    $query.on('input', function () { search(300); });
    $('#search').on('submit', function (event) {
        event.preventDefault();
        search(0);
    });
    $('#reset').on('click', function () {
        $top.val('');
        $bottom.val('');
        search(0);
    });
    $('#alert .btn-close').on('click', showWelcome);
    document.getElementById('carouselIndicators').addEventListener('slid.bs.carousel', updateLinks);

    $('#archiveGrid').on('click', '.archive-delete', function (event) {
        event.stopPropagation();
        const $card = $(this).closest('.archive-card');
        const entry = $card.data('entry');
        archive = archive.filter(function (saved) { return saved !== entry; });
        writeArchive();
        $card.closest('.col').remove();
    }).on('click', '.archive-card', function () {
        cancelLookup();
        cancelGeneration();
        const entry = $(this).data('entry');
        const share = httpUrl(entry.url);
        const url = new URL(share);
        const item = {
            preview: archiveThumb(entry) || share,
            image: httpUrl(entry.source || url.searchParams.get('alt')),
            uuid: entry.uuid,
            share: share,
            download: httpUrl(entry.download),
            alt: caption(entry)
        };
        $top.val(entry.toptext || '');
        $bottom.val(entry.bottomtext || '');
        $query.val(entry.query || '');
        showSlides([item]);
        showWelcome();
        bootstrap.Offcanvas.getOrCreateInstance(document.getElementById('offcanvasArchive')).hide();
        startLookup(item);
    });
    $('#clearArchive').on('click', function () {
        archive = [];
        writeArchive();
        $('#archiveGrid').empty();
    });

    archive.forEach(appendArchiveItem);
    if ($query.val().trim()) {
        search(0);
    }
</script>
{% endblock %}

{% block content %}
<form id="search" method="get" data-validate-query-url="{% url 'autocompletemodel' %}">
    <div id="div_id_query" class="form-group">
        <input type="text" name="query" maxlength="128" class="textinput textInput form-control form-control-lg"
            id="id_query" aria-label="DDB object URL"
            placeholder="https://www.deutsche-digitale-bibliothek.de/item/CRHMM44XWLG7ZNH55BQ5GSAHTYLXJ7Z4">
    </div>
</form>
<div id="alert" class="alert alert-dismissible alert-primary mt-3">
    <button type="button" class="btn-close" aria-label="Dismiss message"></button>
    <span id="alert_message" role="status"><strong>Welcome!</strong> Please fill in the URL of the object from <a
            href="https://www.deutsche-digitale-bibliothek.de/" class="alert-link" title="Deutsche Digitale Bibliothek"
            target="_blank" rel="noopener noreferrer">DDB portal</a> you want to use for your meme.</span>
    <a class="alert-link" data-bs-toggle="offcanvas" href="#offcanvasArchive" role="button"
        aria-controls="offcanvasArchive">Your DDBmeme archive</a>
</div>
<div class="collapse my-4" id="meme">
    <div class="row">
        <div class="col-md-6">
            <div class="card meme-card position-relative">
                <div id="carouselIndicators" class="carousel carousel-dark slide carousel-fade"
                    data-bs-interval="false">
                    <div class="carousel-indicators"></div>
                    <div class="carousel-inner"></div>
                    <a class="carousel-control-prev" href="#carouselIndicators" role="button" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </a>
                    <a class="carousel-control-next" href="#carouselIndicators" role="button" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </a>
                </div>
                <!-- Spinner overlay shown while generating/loading -->
                <div id="memeSpinner" class="d-none position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center" style="background: rgba(255,255,255,0.6); z-index: 10;">
                    <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
                    <span class="visually-hidden" role="status">Loading...</span>
                </div>
            </div>
            <br>
            <div class="text-center">
                <a href="#" id="saveBtn" class="socialBtn btn btn-primary" role="button" style="width:3.5em" download aria-label="Download image">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                </a>
                <a href="#" id="linkBtn" class="socialBtn btn btn-primary" style="width:3.5em" data-bs-toggle="modal" aria-label="Show meme link"
                    data-bs-target="#linkModal">
                    <i class="fa-solid fa-link"></i>
                </a>
                <a href="#" id="facebookBtn" class="socialBtn btn btn-primary" style="width:3.5em" target="_blank" rel="noopener noreferrer" aria-label="Share on Facebook">
                    <i class="fa-brands fa-facebook"></i>
                </a>
                <a href="#" id="twitterBtn" class="socialBtn btn btn-primary" style="width:3.5em" target="_blank" rel="noopener noreferrer" aria-label="Share on X">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
            </div>
        </div>
        <div class="col-md-6">
            <hr class="d-block d-sm-block d-md-none d-lg-none d-xl-none">
            <form id="make" method="get" data-validate-query-url="{% url 'maketextmodel' %}">
                <div id="div_id_toptext" class="form-group">
                    <label for="id_toptext" class="col-form-label ">Text top</label>
                    <input type="text" name="toptext" maxlength="128"
                        class="textinput textInput form-control form-control-lg" id="id_toptext"
                        style="text-transform: uppercase;">
                </div>
                <div id="div_id_bottomtext" class="form-group">
                    <label for="id_bottomtext" class="col-form-label ">Text bottom</label>
                    <input type="text" name="bottomtext" maxlength="128"
                        class="textinput textInput form-control form-control-lg" id="id_bottomtext"
                        style="text-transform: uppercase;">
                </div>
                <input type="hidden" class="textinput textInput form-control" name="image" id="id_image">
                <br>
                <button id="generate" type="submit" class="btn btn-primary btn-lg">Generate</button>
                <button id="reset" type="button" class="btn btn-secondary btn-lg">Reset</button>
            </form>
        </div>
    </div>
</div>
<!-- Offcanvas Archive -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasArchive" aria-labelledby="offcanvasArchiveLabel"
    style="--bs-offcanvas-width: min(900px, 95vw);">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasArchiveLabel">Your DDBmeme Archive</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <div id="archiveGrid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3"></div>
        <button id="clearArchive" type="button" class="btn btn-outline-danger btn-sm clear-archive-fixed">Clear</button>
    </div>
</div>
<div class="modal fade" id="linkModal" tabindex="-1" role="dialog" aria-labelledby="linkModelTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="linkModelTitle">Link to Meme</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <input type="text" class="form-control" id="linkToMeme" aria-label="Meme link" placeholder="Link"
                        onClick="this.setSelectionRange(0, this.value.length)" readonly>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
